[package]
name = "p2p-music-relay"
version = "0.1.0"
edition = "2024"

[dependencies]
libp2p = { version = "0.56", default-features = false, features = ["tokio", "tcp", "noise", "yamux", "ed25519", "macros", "relay", "identify", "autonat"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
futures = "0.3"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
